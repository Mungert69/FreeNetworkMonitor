<IfModule mod_ssl.c>
    <VirtualHost _default_:443>
        ServerAdmin webmaster@localhost
        ServerName local.home
        ErrorLog ${APACHE_LOG_DIR}/error.log
        CustomLog ${APACHE_LOG_DIR}/access.log combined
        SSLEngine on
        SSLCertificateFile  server.crt
        SSLCertificateKeyFile server.key

        Header always set Strict-Transport-Security "max-age=31536000"
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
        Header always set Permissions-Policy "camera=(), geolocation=(), payment=(), usb=()"
        Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://*.readyforquantum.com wss://*.readyforquantum.com; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self' https://auth.readyforquantum.com; upgrade-insecure-requests"

        DocumentRoot /var/www/html
AddType audio/aac .aac
AddType audio/mp4 .mp4 .m4a
AddType audio/mpeg .mp1 .mp2 .mp3 .mpg .mpeg
AddType audio/ogg .oga .ogg
AddType audio/wav .wav
AddType audio/webm .webm
AddType video/mp4 .mp4 .m4v
AddType video/ogg .ogv
AddType video/webm .webm

    <Directory /var/www/html>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>


   
    <Directory /var/www/html/blogpics/*>
       Options +Indexes
       IndexOptions +FancyIndexing
       # other configuration options
    </Directory>
 <Directory /var/www/html/output_audio>
                        Options Indexes FollowSymLinks
                        AllowOverride All
                        Require all granted
                        <IfModule mod_headers.c>
                            Header set Access-Control-Allow-Origin "*"
                        </IfModule>
			Options -MultiViews

                </Directory>
    </VirtualHost>

</IfModule>
